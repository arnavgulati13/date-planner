<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date Night</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Date <span>Night</span></div>
    <nav class="steps" id="steps">
      <div>1 · Onboarding</div><div>2 · Plan</div><div>3 · Pick</div><div>4 · Book</div><div>5 · Review</div>
    </nav>
    <div class="mode" id="mode"></div>
    <div class="couple" id="couple"></div>
    <button type="button" class="demo-toggle" id="demo-toggle" aria-pressed="false" aria-controls="demo-tools"
            title="Show the test scenarios and the data log, for demos">🧪 Demo tools</button>
  </header>

  <div class="web-layout">
    <main class="web-main">
      <div class="screen" id="screen"></div>
    </main>
    <aside class="log" id="demo-tools" aria-label="Demo tools: test scenarios and captured data log">
      <h2>Captured data log</h2>
      <p class="note">What the system would store. Stands in for a database; resets on reload.</p>
      <div class="test-mode" id="test-mode"></div>
      <div class="metrics">
        <div class="metric"><b id="m-selected">0</b><span>Selected</span></div>
        <div class="metric"><b id="m-booked">0</b><span>Booked</span></div>
        <div class="metric"><b id="m-fail">0</b><span>Book fails</span></div>
        <div class="metric"><b id="m-return">–</b><span>Return</span></div>
      </div>
      <div id="log-list"></div>
    </aside>
  </div>

  <script src="simulated_responses.js"></script>
  <script>
    // Page chrome: the step bar. The couple label and all product logic are in app.js.
    const STEP_OF = { onboarding: 0, plan: 1, loading: 2, results: 2, confirm: 3, booking: 3, booked: 3, mismatch: 3, review: 4, thanks: 4 };
    window.onScreenChange = screen => {
      document.getElementById("screen").dataset.screen = screen;
      const idx = STEP_OF[screen];
      [...document.getElementById("steps").children].forEach((el, i) =>
        el.className = i === idx ? "on" : i < idx ? "done" : "");
      window.scrollTo(0, 0);
    };

    // Demo tools (Test mode + data log + AI badge) are hidden unless the presenter opens them.
    // The choice is remembered in this browser only.
    (function () {
      const btn = document.getElementById("demo-toggle");
      const set = open => {
        document.body.classList.toggle("demo-open", open);
        btn.setAttribute("aria-pressed", String(open));
        btn.textContent = open ? "✕ Hide demo tools" : "🧪 Demo tools";
        try { localStorage.setItem("dateNight.demoTools", open ? "1" : "0"); } catch (e) {}
      };
      let saved = false;
      try { saved = localStorage.getItem("dateNight.demoTools") === "1"; } catch (e) {}
      set(saved);
      btn.addEventListener("click", () => set(!document.body.classList.contains("demo-open")));
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
